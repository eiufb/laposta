<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FAST FOOD POSTA | Pizzas y Empanadas | App Oficial</title>
    
    <!-- Scripts Externos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tri-rojo': '#E63946',
                        'tri-amarillo': '#FFB703',
                        'tri-fondo': '#F8F9FA',
                        'tri-texto': '#1D3557',
                        'tri-verde': '#2A9D8F'
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #F8F9FA; color: #1D3557; overflow-x: hidden; }
        .food-card { background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; transition: transform 0.2s; }
        .modal-content { border-radius: 24px 24px 0 0; animation: slideUp 0.3s ease-out; width: 100%; max-width: 500px; margin: 0 auto; background: white; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .swiper { width: 100%; height: 280px; border-radius: 24px; }
        .slide-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(29, 53, 87, 0.9) 5%, transparent 60%); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>

<body class="bg-tri-fondo">

    <!-- Loader -->
    <div id="loader" class="fixed inset-0 z-[500] bg-tri-fondo flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 border-4 border-gray-200 border-t-tri-rojo rounded-full animate-spin"></div>
        <h2 class="mt-4 font-black uppercase italic text-tri-texto">Cargando Posta...</h2>
    </div>

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full z-[100] bg-white/90 backdrop-blur-md px-4 py-3 shadow-md border-b-4 border-tri-amarillo">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black italic tracking-tighter"><span class="text-tri-rojo">▲</span> FAST FOOD <span class="text-tri-amarillo">POSTA</span></h1>
            <button onclick="openCheckoutModal()" class="relative bg-tri-rojo text-white p-2.5 rounded-xl shadow-lg active:scale-90 transition-transform">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-tri-amarillo text-tri-texto text-[10px] font-black h-5 w-5 flex items-center justify-center rounded-full border-2 border-white hidden">0</span>
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 pt-24 pb-24">
        <!-- Slider Promos -->
        <section data-aos="zoom-in">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper" id="promo-slider-wrapper"></div>
                <div class="swiper-pagination"></div>
            </div>
        </section>

        <!-- Categorías y Productos -->
        <section class="mt-8">
            <div id="category-tabs" class="flex space-x-2 overflow-x-auto no-scrollbar py-2 sticky top-[68px] bg-tri-fondo/95 z-40"></div>
            <div id="product-grid" class="grid grid-cols-2 gap-3 mt-4"></div>
        </section>
    </main>

    <!-- Modal de Checkout -->
    <div id="checkout-modal" class="hidden fixed inset-0 z-[200] bg-tri-texto/80 backdrop-blur-sm flex items-end justify-center">
        <div class="modal-content flex flex-col max-h-[95vh]">
            <div class="p-5 flex justify-between items-center border-b-2 border-tri-amarillo">
                <h4 class="font-black italic text-tri-rojo uppercase">Tu Pedido</h4>
                <button onclick="closeCheckoutModal()" class="text-xl p-2 bg-gray-100 rounded-full w-10 h-10">✕</button>
            </div>
            
            <div class="overflow-y-auto p-4 space-y-4">
                <div id="cart-list" class="space-y-2"></div>
                
                <!-- Totales -->
                <div class="bg-gray-50 p-4 rounded-2xl space-y-2">
                    <div class="flex justify-between font-bold text-gray-500"><span>Subtotal</span><span id="cart-subtotal">$0</span></div>
                    <div class="flex justify-between font-bold text-tri-rojo"><span>Envío</span><span id="shipping-cost">$0</span></div>
                    <div class="flex justify-between text-2xl font-black border-t border-dashed pt-2"><span>Total</span><span id="cart-total">$0</span></div>
                </div>

                <!-- Formulario -->
                <div class="space-y-3">
                    <input type="text" id="cust-name" placeholder="Tu Nombre" class="w-full p-4 rounded-xl bg-gray-100 font-bold outline-none border-2 border-transparent focus:border-tri-amarillo">
                    <div class="relative">
                        <input type="text" id="cust-addr" placeholder="Dirección de entrega" class="w-full p-4 rounded-xl bg-gray-100 font-bold outline-none border-2 border-transparent focus:border-tri-amarillo text-sm">
                        <button onclick="getLocation()" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 bg-white rounded-lg shadow-sm">📍</button>
                    </div>
                    
                    <p class="text-[10px] font-black uppercase text-gray-400">Método de Pago</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setPayment('MP')" id="btn-mp" class="p-3 rounded-2xl border-2 border-tri-amarillo bg-tri-amarillo/10 font-black text-[10px] uppercase transition-all">Mercado Pago</button>
                        <button onclick="setPayment('TRANSF')" id="btn-transf" class="p-3 rounded-2xl border-2 border-gray-100 bg-gray-50 opacity-60 font-black text-[10px] uppercase transition-all">Transferencia</button>
                    </div>

                    <div id="transfer-info" class="hidden bg-tri-texto text-white p-4 rounded-2xl text-center">
                        <p class="text-[10px] font-black uppercase text-tri-amarillo">Alias: <span id="alias-val">fastfoodposta</span></p>
                        <button onclick="copyAlias()" class="mt-2 text-[9px] bg-white/20 px-4 py-1 rounded-full uppercase">Copiar Alias</button>
                    </div>
                </div>

                <button onclick="finalAction()" class="w-full py-5 bg-tri-verde text-white rounded-2xl font-black uppercase tracking-widest shadow-xl active:scale-95 transition-transform">
                    Confirmar Pedido vía WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        // === CONFIGURACIÓN ===
        const MI_WHATSAPP = "5493541214553";
        const MI_ALIAS = "fastfoodposta";
        const COSTO_ENVIO = 3000;
        const URL_API = "https://script.google.com/macros/s/AKfycbzbKNq_xHI-kICB4xHzxWE_4NO4a2fCqNALW_s7pgs-Pb44VW5tFePYs5uW8J2y5yWq/exec";

        let cart = {};
        let activeCategory = 'Todos';
        let currentStock = [];
        let selectedPayment = "MP";
        let userCoords = "";

        const products = [
            { id: 901, name: 'Promo 6 Empanadas', price: 14500, category: 'Promos', img: 'https://i.imgur.com/YaYecNo.jpeg' },
            { id: 902, name: 'Promo 2 Pizzas', price: 21500, category: 'Promos', img: 'https://i.imgur.com/RJZAtWF.jpg' },
            { id: 301, name: 'Empanada Carne Salada', price: 2500, category: 'Empanadas', img: 'https://i.imgur.com/zoLvHw9.jpg' },
            { id: 601, name: 'Pizza Mozza con Huevo', price: 12500, category: 'Pizzas', img: 'https://i.imgur.com/HTZ1aBD.jpg' }
        ];

        // === INICIO ===
        window.addEventListener('load', () => {
            if (typeof AOS !== 'undefined') AOS.init();
            renderSlider();
            render();
            fetchStock();
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 1000);
        });

        // === FUNCIONES NÚCLEO ===
        async function fetchStock() {
            try {
                const res = await fetch(URL_API);
                currentStock = await res.json();
                render();
            } catch (e) { console.warn("Usando stock local."); }
        }

        function renderSlider() {
            const wrapper = document.getElementById('promo-slider-wrapper');
            const promos = products.filter(p => p.category === 'Promos');
            wrapper.innerHTML = promos.map(p => `
                <div class="swiper-slide relative">
                    <img src="${p.img}" class="w-full h-full object-cover">
                    <div class="slide-overlay">
                        <h4 class="text-white font-black text-2xl uppercase italic">${p.name}</h4>
                        <button onclick="addToCart(event, ${p.id})" class="mt-2 bg-tri-amarillo px-6 py-2 rounded-xl font-black uppercase text-xs w-fit">¡Pedir!</button>
                    </div>
                </div>`).join('');
            new Swiper(".mySwiper", { loop: true, autoplay: { delay: 3000 }, pagination: { el: ".swiper-pagination" } });
        }

        function render() {
            const grid = document.getElementById('product-grid');
            const tabs = document.getElementById('category-tabs');
            const cats = ['Todos', 'Promos', 'Empanadas', 'Pizzas'];
            
            tabs.innerHTML = cats.map(c => `<button onclick="filterCategory('${c}')" class="px-6 py-2 rounded-full font-black text-xs uppercase border-2 ${activeCategory === c ? 'bg-tri-amarillo border-tri-amarillo text-tri-texto' : 'bg-white border-gray-100 text-gray-400'}">${c}</button>`).join('');

            const filtered = activeCategory === 'Todos' ? products : products.filter(p => p.category === activeCategory);
            grid.innerHTML = filtered.map(p => {
                const qty = cart[p.id] || 0;
                const btn = qty > 0 ? 
                    `<div class="flex items-center justify-between bg-tri-amarillo rounded-xl overflow-hidden"><button onclick="changeQty(${p.id},-1)" class="p-2 font-black">-</button><span class="font-black">${qty}</span><button onclick="changeQty(${p.id},1)" class="p-2 font-black">+</button></div>` :
                    `<button onclick="addToCart(event, ${p.id})" class="w-full py-2 bg-tri-amarillo rounded-xl font-black text-[10px] uppercase">Añadir</button>`;
                return `<div class="food-card p-2 text-center"><img src="${p.img}" class="h-32 w-full object-cover rounded-xl mb-2"><h3 class="font-black text-[10px] uppercase truncate">${p.name}</h3><p class="text-tri-rojo font-black text-sm mb-2">$${p.price.toLocaleString()}</p>${btn}</div>`;
            }).join('');
        }

        // === CARRITO ===
        window.filterCategory = (cat) => { activeCategory = cat; render(); };
        window.addToCart = (e, id) => { cart[id] = (cart[id] || 0) + 1; updateUI(); };
        window.changeQty = (id, n) => { cart[id] = (cart[id] || 0) + n; if(cart[id] <= 0) delete cart[id]; updateUI(); };

        function updateUI() {
            const count = Object.values(cart).reduce((a, b) => a + b, 0);
            const badge = document.getElementById('cart-count');
            badge.innerText = count;
            badge.classList.toggle('hidden', count === 0);

            let subtotal = 0;
            let cartHTML = '';
            Object.entries(cart).forEach(([id, q]) => {
                const item = products.find(x => x.id == id);
                subtotal += item.price * q;
                cartHTML += `<div class="flex justify-between bg-gray-50 p-3 rounded-xl"><span class="text-xs font-black uppercase">${q}x ${item.name}</span><span class="font-black">$${(item.price*q).toLocaleString()}</span></div>`;
            });

            document.getElementById('cart-list').innerHTML = cartHTML;
            document.getElementById('cart-subtotal').innerText = `$${subtotal.toLocaleString()}`;
            document.getElementById('shipping-cost').innerText = count > 0 ? `$${COSTO_ENVIO.toLocaleString()}` : "$0";
            document.getElementById('cart-total').innerText = `$${(subtotal + (count > 0 ? COSTO_ENVIO : 0)).toLocaleString()}`;
            render();
        }

        // === ACCIONES FINALES ===
        window.setPayment = (type) => {
            selectedPayment = type;
            document.getElementById('transfer-info').classList.toggle('hidden', type !== 'TRANSF');
            document.getElementById('btn-mp').classList.toggle('opacity-100', type === 'MP');
            document.getElementById('btn-mp').classList.toggle('opacity-50', type !== 'MP');
            document.getElementById('btn-transf').classList.toggle('opacity-100', type === 'TRANSF');
            document.getElementById('btn-transf').classList.toggle('opacity-50', type !== 'TRANSF');
        };

        window.getLocation = () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    userCoords = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    document.getElementById('cust-addr').value = "📍 Ubicación capturada";
                });
            }
        };

        window.finalAction = () => {
            const name = document.getElementById('cust-name').value;
            const addr = document.getElementById('cust-addr').value;
            if(!name || !addr) return alert("Faltan datos");

            const items = Object.entries(cart).map(([id, q]) => {
                const p = products.find(x => x.id == id);
                return `• ${q}x ${p.name}`;
            }).join('%0A');

            const msg = `*PEDIDO NUEVO*%0A*Cliente:* ${name}%0A*Dirección:* ${addr}${userCoords ? '%0A📍 GPS: '+userCoords : ''}%0A*Pago:* ${selectedPayment}%0A*Detalle:*%0A${items}%0A*TOTAL:* ${document.getElementById('cart-total').innerText}`;

            if(selectedPayment === 'MP') {
                window.open("https://link.mercadopago.com.ar/fastfoodposta", "_blank");
                setTimeout(() => window.open(`https://wa.me/${MI_WHATSAPP}?text=${msg}`, "_blank"), 2000);
            } else {
                window.open(`https://wa.me/${MI_WHATSAPP}?text=${msg}`, "_blank");
            }
        };

        window.openCheckoutModal = () => document.getElementById('checkout-modal').classList.remove('hidden');
        window.closeCheckoutModal = () => document.getElementById('checkout-modal').classList.add('hidden');
        window.copyAlias = () => { navigator.clipboard.writeText(MI_ALIAS); alert("Alias copiado"); };
    </script>
</body>
</html>
