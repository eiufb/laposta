            { id: 721, name: 'Agua Cristal Mini', price: 2000, category: 'Bebidas', img: 'https://imgur.com/cQkCxaK.jpg', badge: '', rating: '4.5', reviews: 8, quality: '' }
        ];

        let cart = {};
        let activeCategory = 'Todos';
        let currentStock = [];

        function startTimer(durationInMinutes, display) {
            let timer = durationInMinutes * 60, minutes, seconds;
            const interval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                if(display) display.textContent = minutes + ":" + seconds;
                if (--timer < 0) { clearInterval(interval); if(display) display.textContent = "00:00"; }
            }, 1000);
        }

        async function fetchStock() {
            try {
                const res = await fetch(URL_API);
                if (!res.ok) throw new Error('Error de red al obtener stock');
                currentStock = await res.json();
                render();
            } catch (e) { 
                console.warn("Stock operando en modo local/fallback:", e);
                currentStock = [];
                render(); 
            }
        }

        function renderSlider() {
            const promos = products.filter(p => p.category === 'Promos');
            document.getElementById('promo-slider-wrapper').innerHTML = promos.map(p => `
                <div class="swiper-slide relative">
                    <img src="${p.img}" class="w-full h-full object-cover">
                    <div class="slide-overlay">
                        <div class="bg-tri-rojo text-white text-[10px] font-black px-2 py-1 rounded-md mb-2 w-fit uppercase italic animate-pulse">Oferta de Hoy</div>
                        <h4 class="text-white font-black text-2xl uppercase italic drop-shadow-md leading-none">${p.name}</h4>
                        <div class="flex justify-between items-center mt-3">
                            <span class="bg-tri-amarillo text-tri-texto px-3 py-1 rounded-full font-black text-lg shadow-lg">$${p.price.toLocaleString()}</span>
                            <button onclick="addToCart(event, ${p.id})" class="bg-tri-verde text-white px-6 py-2 rounded-xl font-black uppercase text-xs shadow-md active:scale-95 transition-all min-h-[44px]">¡Pedir Ahora!</button>
                        </div>
                    </div>
                </div>`).join('');
            
            new Swiper(".mySwiper", { 
                loop: true, 
                autoplay: { delay: 4000, disableOnInteraction: false }, 
                pagination: { el: ".swiper-pagination", clickable: true } 
            });
        }

        function render() {
            const cats = ['Todos', 'Promos', 'Burgers', 'Sandwiches', 'Compartir', 'Bebidas'];
            document.getElementById('category-tabs').innerHTML = cats.map(c => `
                <button onclick="filterCategory('${c}')" class="whitespace-nowrap px-6 py-2 rounded-full font-black text-xs uppercase border-2 min-h-[44px] ${activeCategory === c ? 'bg-tri-amarillo border-tri-amarillo text-tri-texto' : 'bg-white border-gray-100 text-gray-400'}">
                    ${c}
                </button>`).join('');

            const filtered = activeCategory === 'Todos' ? products : products.filter(p => p.category === activeCategory);
            
            if (filtered.length === 0) {
                document.getElementById('product-grid').innerHTML = `
                    <div class="col-span-2 text-center py-12">
                        <p class="text-gray-400 font-bold uppercase text-xs">No hay productos disponibles.</p>
                    </div>`;
                return;
            }

            document.getElementById('product-grid').innerHTML = filtered.map(p => {
                const s = currentStock.find(stock => stock.sabor === p.name);
                const disponible = s ? s.stock : 99;
                const agotado = disponible <= 0;
                const qty = cart[p.id] || 0;

                let actionButton;
                if (agotado) {
                    actionButton = `<button class="mt-2 py-3 w-full rounded-xl text-[10px] font-black uppercase bg-gray-300 text-gray-500 min-h-[44px]">Sin Stock</button>`;
                } else if (qty > 0) {
                    actionButton = `
                    <div class="mt-2 flex items-center justify-between bg-tri-amarillo rounded-xl overflow-hidden min-h-[44px]">
                        <button onclick="changeQty(${p.id}, -1)" class="w-10 py-3 font-black text-tri-texto active:bg-tri-amarillo/50 transition-colors min-h-[44px]">-</button>
                        <span class="font-black text-xs text-tri-texto">${qty}</span>
                        <button onclick="changeQty(${p.id}, 1)" class="w-10 py-3 font-black text-tri-texto active:bg-tri-amarillo/50 transition-colors min-h-[44px]">+</button>
                    </div>`;
                } else {
                    actionButton = `
                    <button onclick="addToCart(event, ${p.id})" class="mt-2 py-3 w-full rounded-xl text-[10px] font-black uppercase bg-tri-amarillo text-tri-texto active:scale-95 transition-transform min-h-[44px]">
                        Añadir
                    </button>`;
                }

                return `
                <div class="food-card ${agotado ? 'opacity-60' : ''}" data-aos="fade-up">
                    <div class="relative aspect-square">
                        <img src="${p.img}" class="h-full w-full object-cover ${agotado ? 'grayscale' : ''}">
                        ${p.badge ? `<span class="absolute top-2 left-2 bg-tri-rojo text-white text-[9px] font-black px-2 py-1 rounded-md uppercase tracking-wide shadow-md">${p.badge}</span>` : ''}
                        ${agotado ? '<span class="absolute inset-0 flex items-center justify-center bg-black/40 text-white font-black text-xs uppercase italic">Agotado</span>' : ''}
                    </div>
                    <div class="p-3 flex flex-col flex-grow text-center">
                        <div class="flex items-center justify-center gap-1 text-[10px] font-bold text-amber-500 mb-0.5">
                            <span>⭐ ${p.rating}</span>
                            <span class="text-gray-400">(${p.reviews})</span>
                        </div>
                        <h3 class="font-black text-[11px] h-8 overflow-hidden uppercase leading-tight">${p.name}</h3>
                        <p class="text-tri-rojo font-black text-lg mt-1">$${p.price.toLocaleString()}</p>
                        ${actionButton}
                    </div>
                </div>`;
            }).join('');
        }

        function updateUI() {
            const count = Object.values(cart).reduce((a, b) => a + b, 0);
            const badge = document.getElementById('cart-count');
            badge.innerText = count;
            badge.classList.toggle('hidden', count === 0);
            
            let subtotal = 0;
            let cartHTML = '';

            if (count === 0) {
                cartHTML = `
                <div class="flex flex-col items-center justify-center h-full py-12 text-center">
                    <svg class="w-16 h-16 text-gray-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                    <p class="text-gray-400 font-bold uppercase text-xs">Tu carrito está vacío</p>
                </div>`;
            } else {
                Object.entries(cart).forEach(([id, q]) => {
                    const item = products.find(x => x.id == id);
                    subtotal += item.price * q;
                    cartHTML += `<div class="flex items-center justify-between bg-white p-4 rounded-xl shadow-sm">
                        <div class="min-w-0 pr-2">
                            <p class="font-black text-xs truncate uppercase">${item.name}</p>
                            <p class="text-tri-rojo font-black">$${item.price.toLocaleString()}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${id}, -1)" class="w-9 h-9 bg-gray-100 rounded-lg font-black min-h-[44px] min-w-[44px] flex items-center justify-center">-</button>
                            <span class="font-black text-base w-4 text-center">${q}</span>
                            <button onclick="changeQty(${id}, 1)" class="w-9 h-9 bg-tri-rojo text-white rounded-lg font-black min-h-[44px] min-w-[44px] flex items-center justify-center">+</button>
                        </div>
                    </div>`;
                });

                subtotal += costoEnvioActual;

                if (appliedDiscount > 0) {
                    const discountAmount = subtotal * appliedDiscount;

                    cartHTML += `

                        <span class="text-xl">🛵</span>
                        <p class="font-black text-xs uppercase">Envío a Domicilio</p>
                    </div>
                    <p class="font-black text-tri-texto">$${costoEnvioActual.toLocaleString()}</p>
                </div>`;
            }

            document.getElementById('cart-list').innerHTML = cartHTML;
            document.getElementById('cart-total').innerText = `$${subtotal.toLocaleString()}`;
            render();
        }

        window.filterCategory = (cat) => { 
            activeCategory = cat; 
            render(); 
            AOS.refresh(); 
            fbq('track', 'Search', {search_string: cat});
        };
        
        window.addToCart = (e, id) => {
            const item = products.find(p => p.id === id);
            const s = currentStock.find(stock => stock.sabor === item.name);
            const max = s ? s.stock : 99;
            if ((cart[id] || 0) < max) { 
                cart[id] = (cart[id] || 0) + 1; 
                updateUI(); 
                fbq('track', 'AddToCart', {content_name: item.name, value: item.price, currency: 'ARS'});
            } else { 
                alert("Máximo stock disponible alcanzado."); 
            }
        };

        window.changeQty = (id, n) => {
            const item = products.find(p => p.id === id);
            const s = currentStock.find(stock => stock.sabor === item.name);
            const max = s ? s.stock : 99;
            if (n > 0 && (cart[id] || 0) >= max) return alert("Máximo disponible");
            cart[id] = (cart[id] || 0) + n; 
            if(cart[id] <= 0) delete cart[id]; 
            updateUI(); 
        };

        window.openCheckoutModal = () => {
            document.getElementById('checkout-modal').classList.remove('hidden');
            fbq('track', 'InitiateCheckout');
        }
        window.closeCheckoutModal = () => document.getElementById('checkout-modal').classList.add('hidden');

        window.payWithEpayco = () => {
            finalAction();
        };

        window.finalAction = () => {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const addr = document.getElementById('cust-addr').value;
            const totalStr = document.getElementById('cart-total').innerText;
            const totalNum = parseFloat(totalStr.replace('$', '').replace('.', ''));

            if(!name || !phone || !addr || Object.keys(cart).length === 0) {
                return alert("Por favor completa tus datos y añade productos.");
            }
            
            const itemsDetalle = Object.entries(cart).map(([id, q]) => {
                const item = products.find(x => x.id == id);
                return { cat: item.category, name: item.name, qty: q, price: item.price };
            });
            const itemsTexto = itemsDetalle.map(i => `${i.qty}x ${i.name}`).join('\n');
            const pedido = { n: name, p: phone, a: addr, t: totalStr, carrito: itemsDetalle, itemsTexto: itemsTexto };

            if (selectedPayment === 'MP') {
                localStorage.setItem('pending_order', JSON.stringify(pedido));
                fbq('track', 'Lead', {content_name: name});
                window.location.href = MI_LINK_PAGO_BASE;
            } else {
                fbq('track', 'Purchase', {value: totalNum, currency: 'ARS'});
                
                itemsDetalle.forEach(item => {
                    const mov = { tipo: 'TRANSFERENCIA', producto: item.cat, sabor: item.name, cantidad: item.qty, monto: item.price * item.qty };
                    fetch(URL_API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(mov) }).catch(err => console.error(err));
                });
                
                const couponMsg = couponCodeApplied ? `\n*Cupón:* ${couponCodeApplied}` : '';
                const msg = `*▲ NUEVO PEDIDO*\n*Cliente:* ${name}\n*Tel:* ${phone}\n*Dirección:* ${addr}${couponMsg}\n\n*Detalle:*\n${itemsTexto}\n*Envío:* $${costoEnvioActual.toLocaleString()}\n\n*TOTAL:* ${totalStr}`;
                
                window.open(`https://wa.me/${MI_WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
                document.getElementById('tracking-screen').classList.remove('hidden');
                startTimer(20, document.getElementById('tracking-msg')); // Temporizador 20 min
                cart = {}; updateUI(); closeCheckoutModal();
                iniciarMapaSeguimiento(clienteLat, clienteLon);
            }
        };

        window.onload = async () => {
            renderSlider();
            await fetchStock();
            AOS.init(); 
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('status') === 'approved' || urlParams.get('pago') === 'ok') {
                const data = JSON.parse(localStorage.getItem('pending_order'));
                if(data) {
                    const totalNum = parseFloat(data.t.replace('$', '').replace('.', ''));
                    fbq('track', 'Purchase', {value: totalNum, currency: 'ARS'});

                    data.carrito.forEach(item => {
                        const mov = { tipo: 'VENTA_MP', producto: item.cat, sabor: item.name, cantidad: item.qty, monto: item.price * item.qty };
                        fetch(URL_API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(mov) }).catch(err => console.error(err));
                    });
                    const msg = `*▲ NUEVO PEDIDO (PAGO MP)*\n*Cliente:* ${data.n}\n*Tel:* ${data.p}\n*Dirección:* ${data.a}\n\n*Detalle:*\n${data.itemsTexto}\n*Envío:* $${costoEnvioActual.toLocaleString()}\n\n*TOTAL:* ${data.t}\n*PAGO CONFIRMADO*`;
                    window.open(`https://wa.me/${MI_WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
                    document.getElementById('tracking-screen').classList.remove('hidden');
                    startTimer(20, document.getElementById('tracking-msg'));
                    localStorage.removeItem('pending_order');
                    iniciarMapaSeguimiento(clienteLat, clienteLon);
                }
            }
            setTimeout(() => {
                document.getElementById('loader').classList.add('fade-out');
                document.body.classList.remove('loading');
            }, 600);
        };

        let clienteLat = null;
        let clienteLon = null;
        let costoEnvioActual = 3000;
        let mapInstance = null;
        let markerRepartidor = null;
        const LOCAL_LAT = 3.3761448546890365;
        const LOCAL_LNG = -76.52754816043648;

        function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function getLocation() {
            const addrInput = document.getElementById('cust-addr');
            if (!navigator.geolocation) return alert("Tu navegador no soporta geolocalización");
            addrInput.value = "Obteniendo ubicación GPS...";
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    clienteLat = position.coords.latitude;
                    clienteLon = position.coords.longitude;
                    const distancia = calcularDistanciaKm(LOCAL_LAT, LOCAL_LNG, clienteLat, clienteLon);
                    costoEnvioActual = Math.max(3000, Math.round(distancia * 1000));
                    addrInput.value = "Ubicación GPS fijada (Escribe tu Cra/Calle y Nro)";
                    updateUI();
                },
                () => { addrInput.value = ""; alert("No se pudo obtener tu ubicación."); },
                { enableHighAccuracy: true }
            );
        }

        function iniciarMapaSeguimiento(destLat, destLon) {
            if (mapInstance) mapInstance.remove();
            const initialLat = destLat ? (LOCAL_LAT + destLat) / 2 : LOCAL_LAT;
            const initialLng = destLon ? (LOCAL_LNG + destLon) / 2 : LOCAL_LNG;

            mapInstance = L.map('live-map').setView([initialLat, initialLng], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);

            const localIcon = L.divIcon({ className: 'custom-div-icon', html: "<div style='background-color:#E63946;color:white;padding:5px;border-radius:50%;text-align:center;'>🏠</div>", iconSize: [30, 30], iconAnchor: [15, 15] });
            const clienteIcon = L.divIcon({ className: 'custom-div-icon', html: "<div style='background-color:#2A9D8F;color:white;padding:5px;border-radius:50%;text-align:center;'>📍</div>", iconSize: [30, 30], iconAnchor: [15, 15] });
            const motoIcon = L.divIcon({ className: 'custom-div-icon', html: "<div style='background-color:#FFB703;color:#1D3557;padding:5px;border-radius:50%;text-align:center;'>🛵</div>", iconSize: [35, 35], iconAnchor: [17, 17] });

            L.marker([LOCAL_LAT, LOCAL_LNG], { icon: localIcon }).addTo(mapInstance).bindPopup("<b>Fast Food Posta</b>").openPopup();
            if (destLat && destLon) L.marker([destLat, destLon], { icon: clienteIcon }).addTo(mapInstance);
            
            markerRepartidor = L.marker([LOCAL_LAT, LOCAL_LNG], { icon: motoIcon }).addTo(mapInstance).bindPopup("<b>En cocina (Preparando pedido)</b>");

            if (destLat && destLon) {
                setTimeout(() => {
                    document.getElementById('tracking-msg').innerText = "¡Pedido listo! El repartidor va en camino.";
                    simularRecorridoRepartidor(LOCAL_LAT, LOCAL_LNG, destLat, destLon);
                }, 20 * 60 * 1000); // 20 minutos de cocina
            }
        }

        function simularRecorridoRepartidor(origLat, origLon, destLat, destLon) {
            let pasos = 100, pasoActual = 0;
            const intervaloMovimiento = setInterval(() => {
                pasoActual++;
                let latActual = origLat + (destLat - origLat) * (pasoActual / pasos);
                let lonActual = origLon + (destLon - origLon) * (pasoActual / pasos);
                if (markerRepartidor) {
                    markerRepartidor.setLatLng([latActual, lonActual]);
                    mapInstance.panTo([latActual, lonActual]);
                }
                if (pasoActual >= pasos) {
                    clearInterval(intervaloMovimiento);
                    document.getElementById('tracking-msg').innerText = "¡Tu pedido ha llegado! Disfrutalo.";
                }
            }, 2000);
        }
    </script>
</body>
</html>
